<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Model Viewer с AR Quick Look Кнопкой</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        body { font-family: sans-serif; text-align: center; }
        model-viewer {
            width: 100%;
            height: 400px; /* Установите высоту для отображения модели */
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

    <h1>Астронавт в 3D и AR</h1>
    <p>Нажмите на иконку AR (кубик), чтобы открыть модель в дополненной реальности на iOS.</p>

    <model-viewer 
        id="model-astronaut"
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
        ar 
        ar-modes="quick-look webxr" 
        camera-controls 
        shadow-intensity="1"
        alt="3D модель астронавта"
        
        ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz#callToAction=Order%20Now&checkoutTitle=Astronaut&checkoutSubtitle=Collector's%20Edition&price=999.00%20USD"
    >
    </model-viewer>

    <p style="margin-top: 40px;">Проверьте консоль браузера после нажатия кнопки "Order Now" в AR Quick Look.</p>

    <script>
        const modelViewer = document.getElementById('model-astronaut');

        // 3. Отлавливаем специальное событие, которое <model-viewer> 
        //    перехватывает из AR Quick Look
        modelViewer.addEventListener('quick-look-button-tapped', (event) => {
            console.log('✅ Кнопка Call To Action в AR Quick Look нажата!');
            
            // --- СЮДА ВСТАВЬТЕ ВАШУ ЛОГИКУ ---
            alert('Событие нажатия кнопки в AR Quick Look успешно перехвачено! Перенаправляем на заказ.');
            
            // Пример: перенаправление на страницу оформления заказа
            window.location.href = 'https://example.com/order-astronaut'; 
            // --- КОНЕЦ ЛОГИКИ ---
        });
    </script>

</body>
</html>
