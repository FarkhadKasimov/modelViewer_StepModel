<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>viewer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        /* ... (Ваши стили: html, body, model-viewer, button[slot="ar-button"] остаются без изменений) ... */

        /* Корректируем видимость плашки со ссылкой */
        .cta-bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 12px;
            display: flex; /* <-- Плашка видна в 3D-просмотрщике */
            justify-content: center;
            pointer-events: none;
            padding: 0 12px
        }
        /* Скрываем плашку, только когда AR-сессия запущена (чтобы не мешала обзору) */
        #preview[ar-status="session-started"] .cta-bar {
            display: none;
        }

        .cta-bar a {
            pointer-events: auto;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 12px;
            font: 600 14px/1 system-ui;
            background: #ffffff;
            color: #0f1115;
            border: 1px solid #d0d4da;
            box-shadow: 0 6px 22px rgba(0, 0, 0, .35)
        }
    </style>
</head>

<body>
    <model-viewer 
        id="preview" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="auto" 
        camera-controls
        exposure="0.75" 
        tone-mapping="agx" 
        src="Models/Aurus_A_DC_AAI-13HN8_White_3_.glb"
        ios-src="Models/Aurus_A_DC_AAI-13HN8_White.usdz#callToAction=Перейти%20на%20сайт&callToActionTarget=https%3A%2F%2Fnazzar.uz%2F"
    >
        <button slot="ar-button">Открыть в AR</button>
        <div class="cta-bar"><a href="https://nazzar.uz/" target="_blank" rel="noopener">Перейти на сайт</a></div>
    </model-viewer>
    </body>

</html>
