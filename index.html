<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background:#0f1115; }
    model-viewer#preview {
      position: relative; display:block; width:100%; height:100dvh;
      padding-bottom: env(safe-area-inset-bottom, 0);
      --poster-color: transparent;
    }

    /* Кнопка AR-запуска */
    button[slot="ar-button"],
    .photo-btn, .ar-tip {
      position: absolute; left: 50%; transform: translateX(-50%);
      padding: 12px 16px; border-radius: 12px; font: 600 14px/1 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:#fff; color:#0f1115; border:1px solid #d0d4da; box-shadow:0 6px 22px rgba(0,0,0,.35); z-index: 20;
    }
    button[slot="ar-button"] { bottom: calc(16px + env(safe-area-inset-bottom, 0)); }

    /* Плашка-ссылка (как раньше) */
    .cta-bar {
      position:absolute; left:12px; right:12px;
      bottom: calc(62px + env(safe-area-inset-bottom, 0)); /* место под фото-кнопку */
      display:flex; justify-content:center; pointer-events:none; z-index:15;
    }
    #preview[ar-status="session-started"] .cta-bar { display:none; }
    .cta-bar a { pointer-events:auto; text-decoration:none; padding:12px 16px; border-radius:12px;
      font:600 14px/1 system-ui; background:#fff; color:#0f1115; border:1px solid #d0d4da; box-shadow:0 6px 22px rgba(0,0,0,.35); }

    /* Фото-кнопка (только в 3D) */
    .photo-btn { bottom: calc(60px + env(safe-area-inset-bottom, 0)); cursor: pointer; }
    #preview[ar-status="session-started"] .photo-btn { display:none; }

    /* Подсказка в AR (WebXR) */
    .ar-tip {
      bottom: calc(16px + env(safe-area-inset-bottom, 0));
      max-width: calc(100% - 24px); text-align:center;
      display:none;
    }
    /* показываем подсказку только во время AR-сессии */
    #preview[ar-status="session-started"] .ar-tip { display:block; }
  </style>
</head>

<body>
  <model-viewer
    id="preview"
    src="Models/Aurus_A_DC_AAI-13HN8_White_3_.glb"
    ios-src="Models/Aurus_A_DC_AAI-13HN8_White.usdz#callToAction=Перейти%20на%20сайт&callToActionTarget=https%3A%2F%2Fnazzar.uz%2F"
    ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto"
    camera-controls exposure="0.75" tone-mapping="agx" shadow-intensity="0.2"
    interaction-prompt="auto">

    <button slot="ar-button" aria-label="Открыть в дополненной реальности">Открыть в AR</button>

    <!-- Фото (PNG) — доступно в 3D -->
    <button class="photo-btn" id="photoBtn" type="button">Фото (PNG)</button>

    <!-- Подсказка в AR (для WebXR / нативная камера недоступна кода) -->
    <div class="ar-tip" id="arTip">
      В AR сделайте снимок кнопками устройства:<br>
      Android — Power + Volume Down • iOS — Side + Volume Up
    </div>

    <!-- твоя CTA-плашка -->
    <div class="cta-bar">
      <a href="https://nazzar.uz/" target="_blank" rel="noopener">Перейти на сайт</a>
    </div>
  </model-viewer>

  <script>
    const mv = document.getElementById('preview');
    const photoBtn = document.getElementById('photoBtn');
    const arTip = document.getElementById('arTip');

    // Снимок в 3D: сохраняем PNG
    photoBtn.addEventListener('click', async () => {
      try {
        const blob = await mv.toBlob({ mimeType: 'image/png' }); // снимок canvas модели (НЕ AR-камера)
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = Object.assign(document.createElement('a'), { href: url, download: 'viewer-shot.png' });
        document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      } catch (e) {
        console.error(e);
      }
    });

    // Переключаем UI в зависимости от статуса AR
    mv.addEventListener('ar-status', (ev) => {
      const started = ev.detail.status === 'session-started';
      // В AR скрываем кнопку фото из 3D; показываем подсказку (в WebXR).
      photoBtn.style.display = started ? 'none' : '';
      // Если открылся Scene Viewer / Quick Look, страница уходит на задний план, подсказка не мешает.
      arTip.style.display = started ? '' : 'none';
    });
  </script>
</body>
</html>
