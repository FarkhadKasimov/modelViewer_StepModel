<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AR с ссылкой (Scene Viewer & Quick Look)</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        /* CSS для полноэкранного режима */
        html, body { height: 100%; margin: 0; background: #0f1115; color: #e9edf5; font: 14px/1.45 system-ui; }
        model-viewer { height: 100%; width: 100%; display: block; background: #0b0e14; --progress-bar-color: #fff; }

        /* Стили для кастомной AR-кнопки */
        button[slot="ar-button"] {
            position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
            padding: 12px 18px; border: 0; border-radius: 12px;
            font: 600 16px system-ui; background: #fff; color: #111;
            cursor: pointer; box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
        }
    </style>
</head>

<body>
    <model-viewer 
        id="preview" 
        ar 
        ar-modes="scene-viewer quick-look" 
        ar-scale="auto" 
        camera-controls
        src="Models/Aurus_A_DC_AAI-13HN8_White_3_.glb"
        
        ios-src="Models/Aurus_A_DC_AAI-13HN8_White.usdz#callToAction=Перейти%20на%20сайт&callToActionTarget=https%3A%2F%2Fnazzar.uz%2F"
    >
        <button slot="ar-button">Открыть в AR</button>
    </model-viewer>

    <script>
        // КОНФИГУРАЦИЯ ССЫЛКИ ДЛЯ SCENE VIEWER
        const CTA_URL = "https://nazzar.uz/";
        const CTA_TEXT = "Перейти на сайт"; // Текст на кнопке баннера

        const pv = document.getElementById("preview");
        const isAndroid = () => /Android/i.test(navigator.userAgent);

        /**
         * Формирует явный Intent URL для Scene Viewer с кнопкой действия.
         */
        function buildSceneViewerIntent(modelAbs, linkUrl, ctaText) {
            const file = encodeURIComponent(modelAbs);
            const url = encodeURIComponent(linkUrl);
            const cta = encodeURIComponent(ctaText);
            const fallbackUrl = encodeURIComponent(window.location.href);

            // Параметры 'cta' и 'url' для Scene Viewer
            return "intent://arvr.google.com/scene-viewer/1.0?file=" + file +
                   "&mode=ar_only&title=Aurus&cta=" + cta + "&url=" + url + 
                   "#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=" + 
                   fallbackUrl + ";end;";
        }

        /**
         * Перехватчик кнопки AR для Android, чтобы принудительно запустить Scene Viewer с ссылкой.
         */
        function attachSceneViewerHandler() {
            // Получаем кнопку AR из Shadow DOM, когда модель загружена
            const btn = pv.shadowRoot.querySelector('button[slot="ar-button"]');
            
            if (isAndroid() && btn) {
                // Важно: Удаляем существующий обработчик (если model-viewer его добавил), 
                // чтобы избежать двойного запуска или конфликта.
                
                // Добавляем наш собственный обработчик
                btn.addEventListener("click", function (ev) {
                    // Используем текущий src модели
                    const modelAbs = new URL(pv.getAttribute("src"), window.location.href).href;
                    const intentUrl = buildSceneViewerIntent(modelAbs, CTA_URL, CTA_TEXT);
                    
                    window.location.href = intentUrl; 
                    ev.preventDefault();
                    ev.stopPropagation();
                }, { once: true });
            }
        }

        // Ждем загрузки модели, чтобы получить доступ к Shadow DOM и кнопке
        pv.addEventListener('load', attachSceneViewerHandler);
        
        // Если AR-кнопка уже отображается (модель быстро загрузилась)
        if (pv.shadowRoot) {
            attachSceneViewerHandler();
        }
    </script>
</body>

</html>
