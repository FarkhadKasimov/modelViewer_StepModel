<!doctype html><html lang="ru"><head>  <meta charset="utf-8" />  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />  <title>viewer</title>  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>  <style>    html,body{height:100%;margin:0;background:#0f1115;color:#e9edf5;font:14px/1.45 system-ui}    model-viewer{height:100%;width:100%;display:block;background:#0b0e14;--progress-bar-color:#fff}    button[slot="ar-button"]{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:12px 18px;border:0;border-radius:12px;font:600 16px system-ui;background:#fff;color:#111;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35)}    .cta-bar{position:absolute;left:0;right:0;bottom:12px;display:none;justify-content:center;pointer-events:none;padding:0 12px}    #preview[ar-status="session-started"] .cta-bar{display:flex}    .cta-bar a{pointer-events:auto;text-decoration:none;padding:12px 16px;border-radius:12px;font:600 14px/1 system-ui;background:#ffffff;color:#0f1115;border:1px solid #d0d4da;box-shadow:0 6px 22px rgba(0,0,0,.35)}  </style></head><body>  <model-viewer id="preview"    ar ar-modes="scene-viewer webxr quick-look" ar-scale="auto" camera-controls    exposure="0.75" tone-mapping="agx" src="Models/generic_passenger_car_pack.glb">    <button slot="ar-button">Открыть в AR</button>    <div class="cta-bar"><a href="https://nazzar.uz/" target="_blank" rel="noopener">Перейти на сайт</a></div>  </model-viewer>  <script>    const CTA_URL = "https://nazzar.uz/";    const pv = document.getElementById("preview");    const isAndroid = () => /Android/i.test(navigator.userAgent);    function buildSceneViewerIntent(modelAbs, linkUrl){      const file = encodeURIComponent(modelAbs);      const link = encodeURIComponent(linkUrl);      return "intent://arvr.google.com/scene-viewer/1.0?file=" + file + "&link=" + link        + "#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=" + encodeURIComponent(location.href) + ";end;";    }    function attach(){      const btn = pv.shadowRoot && pv.shadowRoot.querySelector('button[slot="ar-button"]');      if(!btn){ setTimeout(attach, 50); return; }      if(isAndroid()){        btn.addEventListener("click", function(ev){          const abs = new URL(pv.getAttribute("src"), location.href).href;          const intentUrl = buildSceneViewerIntent(abs, CTA_URL);          window.location.href = intentUrl;          ev.preventDefault(); ev.stopPropagation();        }, { once:true });      }    }    attach();  </script></body></html>
