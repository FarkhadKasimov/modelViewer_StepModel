<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>viewer + AR shutter</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background: #0f1115;
            color-scheme: light dark;
        }

        model-viewer#preview {
            position: relative;
            display: block;
            width: 100%;
            height: 100dvh;
            padding-bottom: env(safe-area-inset-bottom, 0);
            --poster-color: transparent;
        }

        button[slot="ar-button"] {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(16px + env(safe-area-inset-bottom, 0));
            z-index: 20;
            padding: 12px 16px;
            border-radius: 12px;
            font: 600 14px/1 system-ui;
            background: #fff;
            color: #0f1115;
            border: 1px solid #d0d4da;
            box-shadow: 0 6px 22px rgba(0, 0, 0, .35);
            cursor: pointer;
        }

        .cta-bar {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: calc(90px + env(safe-area-inset-bottom, 0));
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 15;
        }

        #preview[ar-status="session-started"] .cta-bar {
            display: none;
        }

        .cta-bar a {
            pointer-events: auto;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 12px;
            font: 600 14px/1 system-ui;
            background: #fff;
            color: #0f1115;
            border: 1px solid #d0d4da;
            box-shadow: 0 6px 22px rgba(0, 0, 0, .35);
        }

        .shutter {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(16px + env(safe-area-inset-bottom, 0));
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid rgba(0, 0, 0, .25);
            box-shadow: 0 10px 28px rgba(0, 0, 0, .45);
            z-index: 25;
            display: none;
            cursor: pointer;
            transition: transform .06s ease;
        }

        .shutter::after {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            background: #fff;
        }

        .shutter:active {
            transform: translateX(-50%) scale(0.96);
        }

        #preview[ar-status="session-started"] .shutter {
            display: block;
        }

        .flash {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 24;
            transition: opacity .15s ease;
        }

        .flash.show {
            opacity: 0.9;
        }

        .toast,
        .ar-tip {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            max-width: calc(100% - 24px);
            padding: 10px 12px;
            border-radius: 12px;
            text-align: center;
            font: 500 13px/1.3 system-ui;
            background: rgba(255, 255, 255, .96);
            color: #0f1115;
            border: 1px solid #d0d4da;
            box-shadow: 0 6px 22px rgba(0, 0, 0, .35);
            z-index: 24;
            display: none;
        }

        .toast {
            bottom: calc(90px + env(safe-area-inset-bottom, 0));
        }

        .toast.show {
            display: block;
        }

        .ar-tip {
            bottom: calc(90px + env(safe-area-inset-bottom, 0));
        }

        #preview.show-tip .ar-tip {
            display: block;
        }
    </style>
</head>

<body> <model-viewer id="preview" src="Models/panda4_2_.glb"
        ios-src="https://funny-shortbread-7777a6.netlify.app/Models/panda4.usdz#callToAction=Order%20Now&checkoutTitle=Astronaut&checkoutSubtitle=Collector's%20Edition&price=999.00%20USD"
        ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto" camera-controls exposure="0.75" tone-mapping="agx"
        shadow-intensity="0.2" interaction-prompt="auto" autoplay data-title="panda4 (2)"
        data-link="https://nazzar.uz/"> <button slot="ar-button" aria-label="Открыть в дополненной реальности">Открыть в
            AR</button> <!-- CTA — видна только вне AR -->
        <!-- <div class="cta-bar"><a href="https://nazzar.uz/" target="_blank" rel="noopener">Перейти на сайт</a></div> -->
        <!-- AR-интерфейс --> <button class="shutter" id="shutterBtn" type="button" aria-label="Сделать фото"></button>
        <div class="flash" id="flash"></div>
        <div class="toast" id="toast">Фото сохранено</div>
        <div class="ar-tip" id="arTip">Не удалось сделать снимок программно.<br>Сделайте скриншот кнопками устройства
            (Android: Power&nbsp;+&nbsp;Vol−, iOS: Side&nbsp;+&nbsp;Vol+).</div>
    </model-viewer>
    
    <p style="margin-top: 40px;">Проверьте консоль браузера после нажатия кнопки "Order Now" в AR Quick Look.</p>

    <script>
        const modelViewer = document.getElementById('model-astronaut');

        // 3. Отлавливаем специальное событие, которое <model-viewer> 
        //    перехватывает из AR Quick Look
        modelViewer.addEventListener('quick-look-button-tapped', (event) => {
            console.log('✅ Кнопка Call To Action в AR Quick Look нажата!');
            
            // --- СЮДА ВСТАВЬТЕ ВАШУ ЛОГИКУ ---
            alert('Событие нажатия кнопки в AR Quick Look успешно перехвачено! Перенаправляем на заказ.');
            
            // Пример: перенаправление на страницу оформления заказа
            window.location.href = 'https://example.com/order-astronaut'; 
            // --- КОНЕЦ ЛОГИКИ ---
        });
    </script>
</body>

</html>
