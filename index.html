<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>viewer</title>

  <!-- model-viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    /* базовая раскладка: на весь экран без прокрутки */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #0f1115; /* тёмный фон, если постер прозрачный */
      touch-action: manipulation;
    }

    /* сам viewer растягиваем на весь вьюпорт, учитываем safe-area */
    model-viewer#preview {
      position: relative; /* важно: для абсолютных дочерних элементов */
      display: block;
      width: 100%;
      height: 100dvh; /* корректно на мобильных */
      padding-bottom: env(safe-area-inset-bottom, 0);
      --progress-bar-color: #fff;
      --poster-color: transparent;
    }

    /* стиль стандартной AR-кнопки в слоте */
    button[slot="ar-button"] {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(16px + env(safe-area-inset-bottom, 0));
      z-index: 20;
      padding: 12px 16px;
      border-radius: 12px;
      font: 600 14px/1 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #ffffff;
      color: #0f1115;
      border: 1px solid #d0d4da;
      box-shadow: 0 6px 22px rgba(0,0,0,.35);
      cursor: pointer;
    }

    /* плашка-ссылка поверх 3D (и только в 3D) */
    .cta-bar {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0));
      display: flex;
      justify-content: center;
      pointer-events: none; /* пропускаем жесты к viewer */
      z-index: 15;          /* выше канваса, ниже системных слоёв */
    }

    /* скрываем плашку в момент AR-сессии */
    #preview[ar-status="session-started"] .cta-bar {
      display: none;
    }

    .cta-bar a {
      pointer-events: auto; /* клики только по кнопке */
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 12px;
      font: 600 14px/1 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #ffffff;
      color: #0f1115;
      border: 1px solid #d0d4da;
      box-shadow: 0 6px 22px rgba(0,0,0,.35);
    }
  </style>
</head>

<body>
  <model-viewer
    id="preview"
    src="Models/Aurus_A_DC_AAI-13HN8_White_3_.glb"
    ios-src="Models/Aurus_A_DC_AAI-13HN8_White.usdz#callToAction=Перейти%20на%20сайт&callToActionTarget=https%3A%2F%2Fnazzar.uz%2F"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    camera-controls
    exposure="0.75"
    tone-mapping="agx"
    shadow-intensity="0.2"
    interaction-prompt="auto"
  >
    <button slot="ar-button" aria-label="Открыть в дополненной реальности">Открыть в AR</button>

    <!-- плашка видима в 3D-просмотре, скрывается во время AR -->
    <div class="cta-bar">
      <a href="https://nazzar.uz/" target="_blank" rel="noopener">Перейти на сайт</a>
    </div>
  </model-viewer>
</body>
</html>
