<!doctype html><html lang="ru"><head>  <meta charset="utf-8" />  <meta name="viewport" content="width=device-width,initial-scale=1" />  <title>Banner</title>  <style>    :root{--bg:#ffffff;--text:#0f1115;--btn:#0070c9;}    html,body{height:100%;margin:0;background:var(--bg);font-family:system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;color:var(--text)}    .wrap{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;gap:12px;width:100%;box-sizing:border-box}    .txt{font-size:15px;font-weight:600;line-height:1.1}    .btn{display:inline-block;padding:10px 14px;border-radius:10px;background:var(--btn);color:#fff;text-decoration:none;font-weight:700}    @media (max-width:420px){ .wrap{padding:12px;flex-direction:column;gap:10px;text-align:center} .btn{width:100%} }  </style></head><body>  <div class="wrap">    <div class="txt">Перейти на сайт чтобы узнать больше</div>    <a class="btn" href="Nazzar test" target="_blank" rel="noopener">Перейти</a>  </div></body></html>
