<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{height:100%;margin:0;background:transparent;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#0f1115}
  .wrap{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:10px}
  .txt{font-size:13px;font-weight:600}
  .btn{padding:8px 12px;border-radius:8px;background:#0070c9;color:#fff;text-decoration:none;font-weight:700;white-space:nowrap}
  @media (max-width:420px){ .wrap{flex-direction:column;gap:8px;text-align:center} .btn{width:100%} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="txt">Перейти на сайт чтобы узнать больше</div>
    <a class="btn" href="https://nazzar.uz/" target="_blank" rel="noopener">Перейти</a>
  </div>
</body>
</html>
